     a canonical pointing at the new home (the signal Google actually follows)
     plus a meta refresh and a JS replace for people. Deliberately NOT noindex -
     that would drop the page before the canonical is credited. -->

<meta http-equiv="refresh" content="0; url=https://bzadayz.com/styles.html">
</head>

</body>
